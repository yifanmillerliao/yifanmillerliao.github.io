<script>
/*
 * C2 · Atelier — two DOM touches Quarto's templates do not expose:
 *   1. the four marks beside the wordmark
 *   2. wrapping "FIG. N —" so only the label carries terracotta
 * Everything else is CSS in custom.scss.
 */
(function () {
  /* Four marks for what the site collects: statistics, photography, chess,
     piano. They sit beside the wordmark in the navbar, where the U-curve
     sparkline used to be. Same stroke weight, same size, one colour. */
  var MARKS =
    '<span class="brand-marks" aria-hidden="true">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M3.8 4v16h16.4"/><path d="M6.4 16.9 19.6 7.4"/>' +
      '<circle cx="7.9" cy="14.3" r="1.15"/><circle cx="11.3" cy="14.9" r="1.15"/>' +
      '<circle cx="13.9" cy="10.3" r="1.15"/><circle cx="18.2" cy="9.9" r="1.15"/></svg>' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M4 8.6h2.9l1.5-2.2h7.2l1.5 2.2H20a1.6 1.6 0 0 1 1.6 1.6v6.6A1.6 1.6 0 0 1 20 18.6H4a1.6 1.6 0 0 1-1.6-1.6v-6.6A1.6 1.6 0 0 1 4 8.6Z"/>' +
      '<circle cx="12" cy="13.4" r="3.1"/></svg>' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M12 2.6v4M10 4.3h4"/>' +
      '<path d="M12 6.6c-2.9 1.5-4.4 3.4-4.4 5.6 0 2.2 1.5 4 4.4 5.6 2.9-1.6 4.4-3.4 4.4-5.6 0-2.2-1.5-4.1-4.4-5.6Z"/>' +
      '<path d="M8.4 17.8h7.2l1.1 2.6H7.3Z"/></svg>' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
      '<rect x="2.8" y="6.4" width="18.4" height="11.2" rx="1.4"/>' +
      '<path d="M8.9 12.6v5"/><path d="M15.1 12.6v5"/>' +
      '<path d="M7.7 6.4h2.4v6h-2.4zM13.9 6.4h2.4v6h-2.4z" fill="currentColor" stroke="none"/></svg>' +
    '</span>';

  function addBrandMarks() {
    var brand = document.querySelector(".navbar-brand");
    if (!brand || brand.querySelector(".brand-marks")) return;
    brand.insertAdjacentHTML("beforeend", MARKS);
  }

  /* Quarto emits "FIG.<nbsp>3 — caption" as one text node. Split off the label
     so the number can carry terracotta without touching the article source.
     Tables get the same treatment (§5: the numbering habit is a signature). */
  function markFigureNumbers() {
    var caps = document.querySelectorAll(
      "figcaption.quarto-float-caption, figure > figcaption, table > caption");
    Array.prototype.forEach.call(caps, function (cap) {
      if (cap.querySelector(".fignum")) return;
      var node = null;
      for (var i = 0; i < cap.childNodes.length; i++) {
        if (cap.childNodes[i].nodeType === 3 && cap.childNodes[i].nodeValue.trim()) {
          node = cap.childNodes[i];
          break;
        }
      }
      if (!node) return;
      var m = node.nodeValue.match(/^(\s*)((?:FIG|TAB)\.[\s ]*\d+)(\s*[—:-]?\s*)/i);
      if (!m) return;
      var span = document.createElement("span");
      span.className = "fignum";
      span.textContent = m[2].replace(/[\s ]+/g, " ");
      node.nodeValue = node.nodeValue.slice(m[0].length);
      cap.insertBefore(document.createTextNode(" — "), node);
      cap.insertBefore(span, cap.firstChild);
    });
  }

  /* Ten glossary notes are written as <strong>term</strong><sup-ref>. Only the
     superscript is hoverable by default, which is a small target for a word
     the reader is actually stuck on. Extend each note's trigger to cover the
     term itself. Quarto builds its tippy instances after this script runs, so
     this waits for load rather than DOMContentLoaded. */
  /* The term must be immediately before the reference, with nothing but
     whitespace between. previousElementSibling is not enough: it skips over
     text nodes, so a run-in bold heading earlier in the same paragraph would
     be claimed by a note at the end of the sentence. The article has 42 bold
     spans and only 11 are glossary terms. */
  function adjacentStrong(ref) {
    var n = ref.previousSibling;
    while (n && n.nodeType === 3 && n.nodeValue.trim() === "") {
      n = n.previousSibling;
    }
    return (n && n.nodeType === 1 && n.tagName === "STRONG") ? n : null;
  }

  function linkTermsToNotes() {
    var refs = document.querySelectorAll('a[role="doc-noteref"]');
    Array.prototype.forEach.call(refs, function (ref) {
      var term = adjacentStrong(ref);
      if (!term) return;
      term.classList.add("term-hover");
      if (!ref._tippy || typeof ref._tippy.setProps !== "function") return;
      try {
        ref._tippy.setProps({ triggerTarget: [term, ref] });
      } catch (e) {
        /* older tippy: the superscript stays the trigger, underline still hints */
      }
    });
  }

  function init() { addBrandMarks(); markFigureNumbers(); }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
  if (document.readyState === "complete") {
    linkTermsToNotes();
  } else {
    window.addEventListener("load", linkTermsToNotes);
  }
})();
</script>
