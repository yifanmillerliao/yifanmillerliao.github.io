project:
  type: website
  output-dir: _site
  # Before every render: the last commit's date for the footer's "Updated"
  # line (tools/write_updated.py), and the photo partials from photos.yml, so
  # a reorder there reaches the gallery and the home strip without a full run
  # of the photo tool (it touches no image and no original in this mode).
  pre-render:
    - tools/write_updated.py
    - tools/build_photos.py --partials-only
  render:
    - "*.qmd"
    - "projects/**/*.qmd"
  # The full-size original of the hero photograph lives at the repo root for
  # re-editing; only the stripped, web-sized copies under assets/img are meant
  # to be published. Excluded here rather than trusted to stay unreferenced.
  resources:
    - "!main_page.jpeg"
    - "!Archive.zip"
    # Originals kept for re-editing, not for publishing: the chessboard capture
    # and the reference eval chart the project card was built from.
    - "!assets/img/source/**"
    # Camera originals: renamed and read by tools/build_photos.py, never served.
    # The web copies under assets/photos are what the page loads.
    - "!photos-source/**"

website:
  title: "Miller Liao"

  navbar:
    background: light
    foreground: dark
    left:
      - href: index.qmd
        text: Home

      - href: projects.qmd
        text: Projects

      - href: photography.qmd
        text: Photography

      - href: about.qmd
        text: About

      - href: cv.qmd
        text: CV

  # One date for the whole site: the last commit's, not the render's.
  page-footer:
    left: "© 2026 Miller Liao"
    right: "Updated {{< var updated >}}"

execute:
  freeze: auto

lightbox:
  # `match: auto` is the standing decision: every figure opens in the lightbox,
  # not only wide ones. The shorthand `lightbox: auto` supplied it implicitly.
  match: auto
  # Captions sit beside the figure, not under it. Stacked below, a long caption
  # takes height from the image, and the two portrait figures (FIG. 7, FIG. 10)
  # collapsed into narrow strips. On phones glightbox ignores this; see
  # custom.scss for the phone treatment.
  desc-position: right

format:
  html:
    theme: custom.scss
    toc: true
    code-fold: true
    include-in-header: assets/html/fonts.html
    # The four marks, once, for the navbar and the About page to use by reference.
    include-before-body: assets/html/marks.html
    include-after-body: assets/html/design-system.html
    # Scoped to html deliberately: the caption LaTeX package rejects an em-dash
    # title-delim, so a top-level crossref block makes every PDF build emit a
    # warning. Kept here so that stays true whenever PDF output is added.
    crossref:
      fig-title: "FIG."
      tbl-title: "TAB."
      # The character before the em dash is a NO-BREAK SPACE (U+00A0), not a
      # regular space, and the two are indistinguishable in an editor. Quarto
      # trims leading ordinary whitespace from title-delim, so a plain " —"
      # renders "FIG. 1— caption" with no gap before the dash; U+00A0 survives
      # the trim and gives "FIG. 1 — caption". After touching this line, check
      # the codepoints rather than trusting your eyes:
      #   python3 -c "import pathlib; [print([hex(ord(c)) for c in l.strip()]) \
      #     for l in pathlib.Path('_quarto.yml').read_text().splitlines() \
      #     if 'title-delim' in l and not l.strip().startswith('#')]"
      # It must print 0x22 0xa0 0x2014 0x22 — quote, nbsp, em dash, quote.
      title-delim: " —"
