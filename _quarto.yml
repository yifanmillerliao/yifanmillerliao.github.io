project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "projects/**/*.qmd"

website:
  title: "Miller Liao"

  navbar:
    background: light
    foreground: dark
    left:
      - href: index.qmd
        text: Home

      - href: projects.qmd
        text: Projects

      - href: about.qmd
        text: About

      - href: cv.qmd
        text: CV

execute:
  freeze: auto

lightbox: auto

format:
  html:
    theme: custom.scss
    toc: true
    code-fold: true
    include-in-header: assets/html/fonts.html
    include-after-body: assets/html/design-system.html
    # Scoped to html deliberately: the caption LaTeX package rejects an em-dash
    # title-delim, so a top-level crossref block makes every PDF build emit a
    # warning. Kept here so that stays true whenever PDF output is added.
    crossref:
      fig-title: "FIG."
      tbl-title: "TAB."
      title-delim: " —"
